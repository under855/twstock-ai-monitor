name: Final FX strip layout
on:
  push:
    paths:
      - '.github/workflows/final-fx-strip-20261102.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build compact stock rows and independent FX strip
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          a=s.index('<style id="no-line-charts">')
          b=s.index('</style>',a)+8
          css='''<style id="no-line-charts">
.marketChart,.marketChartMeta,.spark,.sparkFallback{display:none!important}
.marketChartCard{display:none!important}
.cards>.card:first-child{display:none!important}.cards{grid-template-columns:1fr!important}
.row{grid-template-columns:minmax(150px,1.15fr) minmax(120px,.8fr) 72px 28px;grid-template-areas:"name price score open" "day day day day" "meta meta meta meta";gap:6px 12px;padding:7px 11px;min-height:0}
.row .dayline{grid-area:day;padding-top:3px}.row .meta{grid-area:meta;padding-top:2px}.row .fxSlot{display:none!important}
.fxStrip{display:grid;grid-template-columns:repeat(9,minmax(82px,1fr));gap:6px;margin:8px 0 12px;padding:9px;background:linear-gradient(90deg,#0e1b2d,#0a1524);border:1px solid #213954;border-radius:15px}
.fxStripTitle{grid-column:1/-1;font-size:11px;color:#93a9c2;display:flex;justify-content:space-between;gap:10px}.fxItem{background:#071321;border:1px solid #1d3552;border-radius:8px;padding:6px 7px;min-width:0}.fxItem b{display:block;font-size:10px;color:#bcd1e8}.fxItem strong{display:block;font-size:14px;margin-top:2px}.fxItem small{display:block;color:#718aa5;font-size:8px;margin-top:2px}
@media(max-width:900px){.fxStrip{grid-template-columns:repeat(5,1fr)}}
@media(max-width:720px){.row{grid-template-columns:minmax(105px,1fr) minmax(90px,.8fr) 58px 24px;grid-template-areas:"name price score open" "day day day day" "meta meta meta meta"}.fxStrip{grid-template-columns:repeat(3,1fr)}}
</style>'''
          s=s[:a]+css+s[b:]
          market=re.search(r'<div class="marketCard marketChartCard">[\s\S]*?</div>\s*</section>',s)
          if market:
              s=s[:market.start()]+s[market.end()-10:]
          anchor='<div class="sectionTitle">我的監控牆</div>'
          strip='<section id="fxStrip" class="fxStrip"><div class="fxStripTitle"><span>即時外匯｜各國貨幣兌新台幣</span><span id="fxStamp">載入中…</span></div><div id="fxBoard" style="display:contents"></div></section>\n\n  '+anchor
          if 'id="fxStrip"' not in s:
              s=s.replace(anchor,strip)
          a=s.index('<script id="live-fx-board">')
          b=s.index('</script>',a)+9
          js='''<script id="live-fx-board">
(function(){
  const FX=[['USD','美元'],['JPY','日圓'],['EUR','歐元'],['GBP','英鎊'],['AUD','澳幣'],['CNY','人民幣'],['HKD','港幣'],['KRW','韓元'],['SGD','新加坡幣']];
  let latest=null;
  function fmt(c,v){return (c==='JPY'||c==='KRW')?v.toFixed(4):v.toFixed(3)}
  function render(){
    const board=document.getElementById('fxBoard');if(!board||!latest)return;
    board.innerHTML=FX.map(function(x){const c=x[0],n=x[1],r=latest.rates[c],v=r?1/r:null;return '<div class="fxItem"><b>'+c+' '+n+'</b><strong>'+(v?fmt(c,v):'—')+'</strong><small>1 '+c+' ≈ TWD</small></div>'}).join('');
    const stamp=document.getElementById('fxStamp');if(stamp)stamp.textContent='更新 '+new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  }
  async function load(){try{const r=await fetch('https://open.er-api.com/v6/latest/TWD?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('FX');const j=await r.json();if(j.result!=='success'||!j.rates)throw Error('FX data');latest=j;render()}catch(e){const x=document.getElementById('fxStamp');if(x)x.textContent='匯率來源暫時無法取得'}}
  load();setInterval(load,60000);
})();
</script>'''
          s=s[:a]+js+s[b:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify twice
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'id="fxStrip"' in s and 'repeat(9,minmax(82px,1fr))' in s
          assert '.row .fxSlot{display:none!important}' in s
          assert 'setInterval(load,60000)' in s
          assert '\\n<script id="live-fx-board">' not in s
          print('VERIFY 1 PASS')
          PY
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?: [^>]*)?>([\s\S]*?)</script>',s)
          Path('/tmp/all-inline.js').write_text('\n'.join(blocks),encoding='utf-8')
          print('VERIFY 2 PASS')
          PY
          node --check /tmp/all-inline.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Compact stock rows and add independent live FX strip"
          git push
