name: Apply v0.9.1 live core
on:
  push:
    paths:
      - 'scripts/patch_v091_core.py'
      - '.github/workflows/apply-v091-core.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/patch_v091_core.py
      - name: Validate v091 markers
        run: |
          node --check live-v091.js
          grep -F "APP_VERSION='0.9.1'" index.html
          grep -F 'live-v091.js?v=091' index.html
          grep -F "tw-ai-monitor-v091" sw.js
          ! grep -F 'live-v090.js?v=090' index.html
      - name: Commit promoted v091 core
        run: |
          if git diff --quiet -- index.html sw.js live-v091.js; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js live-v091.js
          git commit -m 'Promote v0.9.1 simplified live controller'
          git push
