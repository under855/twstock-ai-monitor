name: Verify current TAIEX source validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate currently loaded quote engine
        run: |
          node --check live-v091.js
          node scripts/verify_live_feed.mjs
      - name: Validate exchange closing record without treating close as stale intraday quote
        run: |
          python - <<'PY'
          import json,datetime
          from zoneinfo import ZoneInfo
          from pathlib import Path
          j=json.loads(Path('data/latest.json').read_text(encoding='utf-8'))
          q=j.get('taiex') or {}
          date=q.get('date')
          close=q.get('close')
          assert date and isinstance(close,(int,float)) and close>5000
          assert date<=datetime.datetime.now(ZoneInfo('Asia/Taipei')).date().isoformat()
          print('TAIEX_REFERENCE_PASS',date,close,q.get('source'),q.get('time'))
          print('NOTE: a 13:30 closing price is valid after hours; it is not a live tick.')
          PY
