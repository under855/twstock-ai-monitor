name: Apply detail latest-session chart fix
on:
  push:
    branches: ['detail-latest-session-fix-20261030']
    paths: ['.github/workflows/apply-detail-latest-session-fix.yml','scripts/patch_detail_latest_session.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: detail-latest-session-fix-20261030
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply patch
        run: python scripts/patch_detail_latest_session.py
      - name: Static validation
        run: |
          node --check extras-v090.js
          node --check live-v091.js
          grep -F '__TW_DRAW_DETAIL_TODAY__' extras-v090.js
          grep -F '095session2' index.html
          grep -F '094r9' index.html
          grep -F 'tw-ai-monitor-v095session2' sw.js
      - name: Browser detail persistence acceptance
        shell: bash
        run: |
          npm install --no-save playwright-core@latest >/dev/null 2>&1
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser); export CHROME
          python -m http.server 8000 >/tmp/http.log 2>&1 &
          cat > verify-detail.mjs <<'JS'
          import {chromium} from 'playwright-core';
          const b=await chromium.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox']});
          const p=await b.newPage({viewport:{width:1280,height:1000},timezoneId:'Asia/Taipei',locale:'zh-TW',serviceWorkers:'block'});
          const errors=[];p.on('pageerror',e=>errors.push(e.message));
          await p.addInitScript(()=>localStorage.setItem('twAiWatchV3',JSON.stringify(['2330','009817','0050','3711','3293','2002','00878','00919'])));
          await p.goto('http://127.0.0.1:8000/?detailqa='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
          await p.waitForFunction(()=>[...document.querySelectorAll('#watch article.row canvas.spark')].filter(c=>c.dataset.sessionDate==='2026-10-30'&&Number(c.dataset.todayPoints)>=50).length>=8,null,{timeout:60000});
          const row=p.locator('#watch article.row').filter({has:p.locator('.sym',{hasText:'3711'})}).first();await row.click();await p.waitForSelector('#sheet.show',{timeout:15000});
          await p.waitForFunction(()=>document.getElementById('bigChart')?.dataset?.sessionDate==='2026-10-30'&&Number(document.getElementById('bigChart')?.dataset?.todayPoints)>=50,null,{timeout:30000});
          const snap=()=>p.evaluate(()=>({price:document.getElementById('dPrice')?.textContent.trim(),points:Number(document.getElementById('bigChart')?.dataset?.todayPoints||0),session:document.getElementById('bigChart')?.dataset?.sessionDate||'',msg:document.getElementById('chartMsg')?.textContent.trim(),display:getComputedStyle(document.getElementById('bigChart')).display}));
          let s=await snap();console.log('BEFORE',JSON.stringify(s));if(s.price!=='668'||s.points<50||s.session!=='2026-10-30'||s.display==='none')throw Error('detail chart initial regression');
          await p.waitForTimeout(18000);s=await snap();console.log('AFTER',JSON.stringify(s));if(s.price!=='668'||s.points<50||s.session!=='2026-10-30'||s.display==='none')throw Error('15s detail repaint regression');
          if(errors.length)throw Error(errors.join(' | '));await b.close();
          JS
          node verify-detail.mjs
      - name: Commit patched runtime
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extras-v090.js live-v091.js index.html sw.js
          git diff --cached --quiet && exit 0
          git commit -m 'Keep latest-session chart in stock detail'
          git push origin HEAD:detail-latest-session-fix-20261030
