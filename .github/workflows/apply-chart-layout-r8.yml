name: Apply chart layout r8
on:
  push:
    branches:
      - feature-chart-layout-v094r8-active
    paths:
      - .github/workflows/apply-chart-layout-r8.yml
      - .github/scripts/patch_chart_layout_r8.py
      - .github/scripts/verify_chart_layout_r8.mjs
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-chart-layout-v094r8-active
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python .github/scripts/patch_chart_layout_r8.py
      - name: Static checks
        run: |
          node --check extras-v090.js
          grep -F 'id="taiexChart"' index.html
          grep -F 'tw-ai-monitor-v094r8' sw.js
          grep -F 'todayMinTime' extras-v090.js
      - name: Browser smoke test
        run: |
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          test -n "$CHROME"
          export CHROME
          npm install --no-save playwright-core@latest >/dev/null 2>&1
          python -m http.server 8000 >/tmp/http.log 2>&1 &
          node .github/scripts/verify_chart_layout_r8.mjs
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html extras-v090.js sw.js
          git diff --cached --quiet && exit 0
          git commit -m 'Fix intraday chart axis and add TAIEX chart'
          git push origin HEAD:feature-chart-layout-v094r8-active
