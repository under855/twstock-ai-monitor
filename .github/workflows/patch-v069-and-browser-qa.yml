name: Patch v069 TAIEX and dividend browser QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-v069-and-browser-qa.yml'
      - 'scripts/patch_v069.py'
      - 'scripts/patch_v069_browserqa.py'

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply v069 patch in working tree
        run: |
          python scripts/patch_v069.py
          python scripts/patch_v069_browserqa.py

      - name: Static assertions
        run: |
          grep -q "const APP_VERSION='0.6.9'" index.html
          grep -q 'dividend-enhance.js?v=069' index.html
          grep -q 'hotfix-v069.js?v=069' index.html
          grep -q "tw-ai-monitor-v069" sw.js
          grep -q "data/dividends.json" sw.js
          grep -q "./data/dividends.json?ts=" dividend-enhance.js
          grep -q "啟動與 15 秒更新由 index 統一排程" fix.js
          grep -q "immediatePrefetch:false" hotfix-v065.js
          grep -q "officialRefreshOnOpen:false" hotfix-v066.js
          grep -q "liveParams.get('autodetail')" index.html
          grep -q "const browserQa=new URLSearchParams(location.search).get('browserqa')==='1'" dividend-enhance.js
          if grep -q 'setInterval(refresh,15000)' index.html; then echo 'old full refresh interval remains'; exit 1; fi
          if grep -q 'startupTimer=setInterval' fix.js; then echo 'old startup polling remains'; exit 1; fi
          if grep -q 'render(true).catch(()=>{});' hotfix-v067.js; then echo 'v067 immediate live update remains'; exit 1; fi
          python - <<'PY'
          import json
          m=json.load(open('data/latest.json',encoding='utf-8'))
          assert m['tradeDate']=='2026-10-28'
          assert m['taiex']['close']==47035.58
          assert m['taiex']['change']==939.35
          d=json.load(open('data/dividends.json',encoding='utf-8'))['items']
          x=[r for r in d if r['code']=='0050' and r['exDate']>='2025-10-28']
          assert any(r['exDate']=='2026-07-21' and r['paymentDate']=='2026-08-10' and r['cashDividend']==0.6 for r in x)
          assert any(r['exDate']=='2026-01-22' and r['paymentDate']=='2026-02-11' and r['cashDividend']==1.0 for r in x)
          print('STATIC_DATA_PASS',x)
          PY

      - name: Browser self-test TAIEX and 0050 dividends
        timeout-minutes: 2
        run: |
          python -m pip install --quiet playwright
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER || true' EXIT
          sleep 2
          python - <<'PY'
          import shutil
          from playwright.sync_api import sync_playwright

          chrome=shutil.which('google-chrome') or shutil.which('google-chrome-stable') or shutil.which('chromium')
          assert chrome, 'system Chrome not found'
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True, executable_path=chrome, args=['--no-sandbox','--disable-dev-shm-usage'])
              context=browser.new_context(service_workers='block')
              page=context.new_page()
              def route_handler(route):
                  if route.request.url.startswith('https://'):
                      route.abort()
                  else:
                      route.continue_()
              page.route('**/*', route_handler)
              page.goto('http://127.0.0.1:8000/?browserqa=1&autodetail=0050', wait_until='domcontentloaded', timeout=15000)
              page.wait_for_function("document.getElementById('taiex')?.textContent === '47,035.58'", timeout=20000)
              page.wait_for_function("document.getElementById('dividendEvents')?.innerText.includes('2026-07-21') && document.getElementById('dividendEvents')?.innerText.includes('2026-01-22')", timeout=20000)

              taiex=page.locator('#taiex').inner_text()
              taiex_chg=page.locator('#taiexChg').inner_text()
              div_text=page.locator('#dividendEvents').inner_text()
              title=page.locator('#dividendEvents').locator('xpath=..').locator('h3').inner_text()
              count=page.locator('#dividendEvents .event').count()

              assert taiex=='47,035.58', taiex
              assert '+939.35' in taiex_chg and '2026/10/28' in taiex_chg, taiex_chg
              assert '近一年' in title and '最近 3 次' in title, title
              assert '2026-07-21' in div_text and '0.6' in div_text and '2026-08-10' in div_text, div_text
              assert '2026-01-22' in div_text and '1' in div_text and '2026-02-11' in div_text, div_text
              assert 1 <= count <= 3, count
              print('BROWSER_QA_PASS')
              print('TAIEX='+taiex+' '+taiex_chg)
              print('0050_DIVIDENDS='+div_text.replace('\n',' | '))
              browser.close()
          PY

      - name: Commit only after browser QA passes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js dividend-enhance.js fix.js hotfix-v065.js hotfix-v066.js hotfix-v067.js
          if git diff --cached --quiet; then
            echo "No app change"
          else
            git commit -m "Promote v069 TAIEX and dividend fix after browser QA"
            git push
          fi
