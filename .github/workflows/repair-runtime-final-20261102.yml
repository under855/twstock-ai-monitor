name: Repair runtime final
on:
  push:
    paths:
      - '.github/workflows/repair-runtime-final-20261102.yml'
      - 'scripts/final_fx_strip.py'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final layout
        run: python scripts/final_fx_strip.py
      - name: Verify twice
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'id="fxStrip"' in s
          assert 'id="fxBoardStrip"' in s
          assert 'repeat(9,minmax(82px,1fr))' in s
          assert 'setInterval(load,60000)' in s
          assert '\\n<script id="live-fx-board">' not in s
          print('VERIFY 1 PASS')
          PY
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?: [^>]*)?>([\s\S]*?)</script>',s)
          Path('/tmp/all-inline.js').write_text('\n'.join(blocks),encoding='utf-8')
          print('VERIFY 2 EXTRACT PASS')
          PY
          node --check /tmp/all-inline.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Compact stock rows and add independent live FX strip"
          git push
