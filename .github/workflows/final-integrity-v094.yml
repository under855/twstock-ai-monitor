name: Final v0.9.4 integrity repair
on:
  push:
    paths:
      - '.github/workflows/final-integrity-v094.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply integrity fixes
        run: python scripts/fix_v094_integrity.py
      - name: Static checks
        run: |
          python -m py_compile scripts/update_latest.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('scripts/update_latest.py').read_text(encoding='utf-8')
          i=Path('index.html').read_text(encoding='utf-8')
          checks={
            'TWSE actual date':"'tradeDate':row_date,'source':'TWSE STOCK_DAY_ALL'" in s,
            'TPEx actual date':"'tradeDate':row_date,'source':'TPEx OpenAPI'" in s,
            'TWSE parses Date':"row_date=roc_to_iso(r.get('Date'))" in s,
            'cache is not first return':'if(!force&&loadUniverseCache())return universeMap' not in i,
            'cache remains fallback':'if(loadUniverseCache())return universeMap' in i,
            'version unchanged':"const APP_VERSION='0.9.4';" in i,
          }
          print(checks)
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('FAILED '+', '.join(bad))
          PY
      - name: Generate latest and verify source dates are truthful
        run: |
          python scripts/update_latest.py
          python3 - <<'PY'
          import json, urllib.request
          from pathlib import Path
          j=json.loads(Path('data/latest.json').read_text(encoding='utf-8'))
          def get(url):
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
            with urllib.request.urlopen(req,timeout=30) as r:return json.loads(r.read().decode('utf-8-sig'))
          tw=get('https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL')
          tp=get('https://www.tpex.org.tw/openapi/v1/tpex_mainboard_quotes')
          r50=next(x for x in tw if str(x.get('Code'))=='0050')
          r3293=next(x for x in tp if str(x.get('SecuritiesCompanyCode'))=='3293')
          def roc(v):
            d=''.join(c for c in str(v) if c.isdigit())
            if len(d)==7:return f'{int(d[:3])+1911:04d}-{d[3:5]}-{d[5:7]}'
            if len(d)==8:return f'{d[:4]}-{d[4:6]}-{d[6:8]}'
            raise ValueError(v)
          got50=j['symbols']['0050']['tradeDate']; exp50=roc(r50['Date'])
          got3293=j['symbols']['3293']['tradeDate']; exp3293=roc(r3293['Date'])
          print('0050',got50,exp50,j['symbols']['0050']['close'])
          print('3293',got3293,exp3293,j['symbols']['3293']['close'])
          if got50!=exp50 or got3293!=exp3293: raise SystemExit('source date mismatch')
          if j['tradeDate']=='2026-10-29' and exp50!='2026-10-29' and got50=='2026-10-29': raise SystemExit('false freshness')
          PY
      - name: Commit only after checks pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html scripts/update_latest.py data/latest.json
          git diff --cached --quiet && exit 0
          git commit -m 'Fix v0.9.4 fallback data integrity'
          git push
