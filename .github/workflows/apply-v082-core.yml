name: Apply v0.8.2 intraday chart core

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_v082_core.py'
      - 'live-v081.js'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch index and service worker
        run: python scripts/patch_v082_core.py
      - name: Validate markers
        run: |
          grep -q "APP_VERSION='0.8.2'" index.html
          grep -q 'live-v081.js?v=082' index.html
          grep -q "tw-ai-monitor-v082" sw.js
          grep -q "const VERSION='0.8.2'" live-v081.js
          node --check live-v081.js
      - name: Commit promoted core
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git diff --cached --quiet || git commit -m "Promote v0.8.2 true intraday charts to core"
          git push
