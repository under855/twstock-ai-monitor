name: Verify TWSE sector feed (read-only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-sector-feed.yml'
      - 'scripts/probe_sector_feed.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate dated official industry indices and sample scrolling text
        run: python scripts/probe_sector_feed.py
