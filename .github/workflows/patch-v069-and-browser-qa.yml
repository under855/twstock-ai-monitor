name: Patch v069 TAIEX and dividend browser QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-v069-and-browser-qa.yml'
      - 'scripts/patch_v069.py'

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply v069 patch in working tree
        run: python scripts/patch_v069.py

      - name: Static assertions
        run: |
          grep -q "const APP_VERSION='0.6.9'" index.html
          grep -q 'dividend-enhance.js?v=069' index.html
          grep -q 'hotfix-v069.js?v=069' index.html
          grep -q "tw-ai-monitor-v069" sw.js
          grep -q "data/dividends.json" sw.js
          grep -q "./data/dividends.json?ts=" dividend-enhance.js
          grep -q "啟動與 15 秒更新由 index 統一排程" fix.js
          grep -q "immediatePrefetch:false" hotfix-v065.js
          grep -q "officialRefreshOnOpen:false" hotfix-v066.js
          grep -q "liveParams.get('browserqa')!=='1'" index.html
          if grep -q 'setInterval(refresh,15000)' index.html; then echo 'old full refresh interval remains'; exit 1; fi
          if grep -q 'startupTimer=setInterval' fix.js; then echo 'old startup polling remains'; exit 1; fi
          if grep -q 'render(true).catch(()=>{});' hotfix-v067.js; then echo 'v067 immediate live update remains'; exit 1; fi
          python - <<'PY'
          import json
          m=json.load(open('data/latest.json',encoding='utf-8'))
          assert m['tradeDate']=='2026-10-28'
          assert m['taiex']['close']==47035.58
          assert m['taiex']['change']==939.35
          d=json.load(open('data/dividends.json',encoding='utf-8'))['items']
          x=[r for r in d if r['code']=='0050' and r['exDate']>='2025-10-28']
          assert any(r['exDate']=='2026-07-21' and r['paymentDate']=='2026-08-10' and r['cashDividend']==0.6 for r in x)
          assert any(r['exDate']=='2026-01-22' and r['paymentDate']=='2026-02-11' and r['cashDividend']==1.0 for r in x)
          print('STATIC_DATA_PASS',x)
          PY

      - name: Browser self-test TAIEX and 0050 dividends
        timeout-minutes: 2
        run: |
          python -m pip install --quiet selenium
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER || true' EXIT
          sleep 2
          python - <<'PY'
          import time
          from selenium import webdriver
          from selenium.common.exceptions import TimeoutException
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options

          o=Options();o.page_load_strategy='eager'
          for a in ['--headless=new','--no-sandbox','--disable-gpu','--disable-dev-shm-usage','--disable-features=ServiceWorker','--window-size=1280,900']:
              o.add_argument(a)
          d=webdriver.Chrome(options=o)
          d.set_page_load_timeout(8)
          d.execute_cdp_cmd('Network.enable',{})
          d.execute_cdp_cmd('Network.setBlockedURLs',{'urls':['https://*']})
          try:
              try:d.get('http://127.0.0.1:8000/?browserqa=1')
              except TimeoutException:
                  try:d.execute_script('window.stop();')
                  except Exception:pass
              d.set_page_load_timeout(30)
              d.set_script_timeout(30)
              deadline=time.time()+20
              taiex=''
              while time.time()<deadline:
                  try:
                      taiex=d.find_element(By.ID,'taiex').text
                      if taiex=='47,035.58':break
                  except Exception:pass
                  time.sleep(.25)
              assert taiex=='47,035.58',taiex
              tc=d.find_element(By.ID,'taiexChg').text
              assert '+939.35' in tc and '2026/10/28' in tc,tc

              rows=d.find_elements(By.CSS_SELECTOR,'#watch .row')
              row0050=next((r for r in rows if r.find_element(By.CSS_SELECTOR,'.sym').text.strip()=='0050'),None)
              assert row0050 is not None,'0050 row missing'
              row0050.click()
              deadline=time.time()+20;text=''
              while time.time()<deadline:
                  try:
                      text=d.find_element(By.ID,'dividendEvents').text
                      if '2026-07-21' in text and '2026-01-22' in text:break
                  except Exception:pass
                  time.sleep(.25)
              assert '2026-07-21' in text and '0.6' in text and '2026-08-10' in text,text
              assert '2026-01-22' in text and '1' in text and '2026-02-11' in text,text
              events=d.find_elements(By.CSS_SELECTOR,'#dividendEvents .event')
              assert 1 <= len(events) <= 3,f'event count={len(events)}'
              title=d.find_element(By.CSS_SELECTOR,'#dividendEvents').find_element(By.XPATH,'..').find_element(By.TAG_NAME,'h3').text
              assert '近一年' in title and '最近 3 次' in title,title
              print('BROWSER_QA_PASS')
              print('TAIEX='+taiex+' '+tc)
              print('0050_DIVIDENDS='+text.replace('\n',' | '))
          finally:d.quit()
          PY

      - name: Commit only after browser QA passes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js dividend-enhance.js fix.js hotfix-v065.js hotfix-v066.js hotfix-v067.js
          if git diff --cached --quiet; then
            echo "No app change"
          else
            git commit -m "Promote v069 TAIEX and dividend fix after browser QA"
            git push
          fi
