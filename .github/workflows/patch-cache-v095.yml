name: Patch split cache key
on:
  push:
    paths:
      - '.github/workflows/patch-cache-v095.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Update cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'split-layout-v095.js?v=095sync2'
          new = 'split-layout-v095.js?v=095sync3'
          if old not in s:
              raise SystemExit('cache key not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Bump split layout cache key'
          git pull --rebase origin main
          git push origin HEAD:main
