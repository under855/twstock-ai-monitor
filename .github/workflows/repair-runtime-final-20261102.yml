name: Repair runtime final
on:
  push:
    paths:
      - '.github/workflows/repair-runtime-final-20261102.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair escaped script block
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<script src="./foreign-live-test.js?v=2"></script>'
          head, sep, tail=s.partition(marker)
          if not sep:
              raise SystemExit('marker missing')
          if '\\n<script id="live-fx-board">' in tail:
              tail=tail.replace('\\n','\n')
          p.write_text(head+sep+tail,encoding='utf-8')
          PY
      - name: Verify runtime twice
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert '\\n<script id="live-fx-board">' not in s
          assert '<script id="live-fx-board">' in s
          print('VERIFY 1 PASS')
          PY
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?: [^>]*)?>([\s\S]*?)</script>',s)
          Path('/tmp/all-inline.js').write_text('\n'.join(blocks),encoding='utf-8')
          print('VERIFY 2 EXTRACT PASS')
          PY
          node --check /tmp/all-inline.js
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Repair escaped FX runtime block"
          git push
