name: Verify dual-source consistency
on:
  push:
    paths:
      - 'scripts/verify_dual_source_consistency.mjs'
      - '.github/workflows/verify-dual-source-consistency.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify runtime syntax
        run: node --check live-v091.js
      - name: Run repeated dual-source consistency verification
        run: node scripts/verify_dual_source_consistency.mjs
