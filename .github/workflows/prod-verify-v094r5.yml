name: Production verification v0.9.4r5
on:
  push:
    branches: ['prod-verify-v094r5']
    paths:
      - '.github/workflows/prod-verify-v094r5.yml'
      - 'scripts/verify_prod_r5.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for production r5 assets
        run: |
          SITE='https://under855.github.io/twstock-ai-monitor'
          ok=0
          for i in $(seq 1 24); do
            curl -fsSL --max-time 20 "$SITE/?verify=$RANDOM" -o /tmp/index.html || true
            if grep -Fq './extras-v090.js?v=094r5' /tmp/index.html; then
              curl -fsSL --max-time 20 "$SITE/data/news.json?verify=$RANDOM" -o /tmp/news.json
              node -e "const j=require('/tmp/news.json'); if(!(j.stocks?.['3711']?.length>=1&&j.stocks?.['3293']?.length>=1)) process.exit(1); console.log('PROD_ASSET_NEWS_OK',j.stocks['3711'].length,j.stocks['3293'].length)"
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = 1
      - name: Install browser harness
        run: |
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          test -n "$CHROME"
          echo "CHROME=$CHROME" >> "$GITHUB_ENV"
          npm install --no-save playwright-core@latest >/dev/null 2>&1
      - name: Verify non-TSMC detail charts and news
        run: node scripts/verify_prod_r5.mjs
