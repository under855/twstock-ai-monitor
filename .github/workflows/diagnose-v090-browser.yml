name: Diagnose v0.9.0 browser live state
on:
  push:
    paths:
      - '.github/workflows/diagnose-v090-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright-core@latest
      - name: Browser diagnostic
        env:
          URL: https://under855.github.io/twstock-ai-monitor/
        run: |
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          export CHROME
          cat > diag.mjs <<'JS'
          import { chromium } from 'playwright-core';
          const b=await chromium.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox']});
          const c=await b.newContext({viewport:{width:390,height:844},deviceScaleFactor:3,isMobile:true,hasTouch:true,timezoneId:'Asia/Taipei',serviceWorkers:'allow'});
          const p=await c.newPage();
          p.on('console',m=>console.log('BROWSER_CONSOLE',m.type(),m.text()));
          p.on('pageerror',e=>console.log('BROWSER_PAGEERROR',e.stack||e.message));
          p.on('requestfailed',r=>{if(/mis\.twse|cors\.dev|allorigins|yahoo/.test(r.url()))console.log('REQUEST_FAILED',r.url(),r.failure()?.errorText)});
          p.on('response',r=>{if(/mis\.twse|cors\.dev/.test(r.url()))console.log('RESPONSE',r.status(),r.url().slice(0,220))});
          await p.goto(process.env.URL+'?diag090='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
          for(let i=0;i<8;i++){
            await p.waitForTimeout(5000);
            const x=await p.evaluate(()=>({title:document.title,state:window.__TW_LIVE_V090__||null,rows:[...document.querySelectorAll('#watch article.row')].map(r=>({code:r.querySelector('.sym')?.textContent?.trim(),state:r.dataset.liveState,date:r.dataset.liveDate,price:r.querySelector('.price')?.textContent,meta:r.querySelector('.meta')?.textContent}))}));
            console.log('SNAPSHOT',i,JSON.stringify(x));
          }
          await b.close();
          JS
          node diag.mjs
