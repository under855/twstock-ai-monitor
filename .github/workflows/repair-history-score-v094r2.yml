name: Fix detail today chart v0.9.4r4
on:
  push:
    branches: ['fix-detail-today-v094r4']
    paths:
      - '.github/workflows/repair-history-score-v094r2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve market core
        run: sha256sum live-v091.js scripts/update_latest.py > /tmp/core.before
      - name: Patch detail today chart fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('extras-v090.js')
          s=p.read_text(encoding='utf-8')
          old="""    show=async function(code,opts={}){\n      const key=String(code),out=await baseShow(key,opts);ensureDetailChartTabs(key);\n      loadHistoryFor(key).then(()=>{try{if(String(active||'')===key&&document.getElementById('sheet')?.classList.contains('show'))ensureDetailChartTabs(key)}catch{}}).catch(()=>{});\n      return out;\n    };\n"""
          assert old in s
          new="""    show=async function(code,opts={}){\n      const key=String(code),out=await baseShow(key,opts);ensureDetailChartTabs(key);\n      loadHistoryFor(key).then(()=>{try{if(String(active||'')===key&&document.getElementById('sheet')?.classList.contains('show'))ensureDetailChartTabs(key)}catch{}}).catch(()=>{});\n      ensureTodayChartFor(key).then(points=>{\n        try{\n          if(String(active||'')!==key||!document.getElementById('sheet')?.classList.contains('show')||points.length<2)return;\n          const live=document.getElementById('bigChart');if(!live||typeof draw!=='function')return;\n          if((detailModeByCode.get(key)||'today')!=='today')return;\n          draw(live,points.map(x=>({date:x.time,close:x.close})),false,priceFor(key));\n          const msg=document.getElementById('chartMsg');if(msg)msg.textContent=`今日 ${points.length} 個 5 分鐘資料點｜分時備援走勢`;\n        }catch{}\n      }).catch(()=>{});\n      return out;\n    };\n"""
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          p=Path('index.html'); s=p.read_text(encoding='utf-8').replace('./extras-v090.js?v=094r3','./extras-v090.js?v=094r4'); p.write_text(s,encoding='utf-8')
          p=Path('sw.js'); s=p.read_text(encoding='utf-8').replace("const CACHE='tw-ai-monitor-v094r3';","const CACHE='tw-ai-monitor-v094r4';"); p.write_text(s,encoding='utf-8')
          PY
      - name: Verify static integrity
        run: |
          node --check extras-v090.js
          grep -F '分時備援走勢' extras-v090.js
          grep -F './extras-v090.js?v=094r4' index.html
          grep -F "const CACHE='tw-ai-monitor-v094r4';" sw.js
          sha256sum live-v091.js scripts/update_latest.py > /tmp/core.after
          diff -u /tmp/core.before /tmp/core.after
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extras-v090.js index.html sw.js
          git commit -m 'Fix detail today chart fallback for non-TSMC stocks'
          git push origin HEAD:fix-detail-today-v094r4
