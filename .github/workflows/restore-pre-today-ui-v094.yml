name: Restore pre-today-chart UI v0.9.4
on:
  push:
    branches: ['restore-pre-today-ui-v094']
    paths:
      - '.github/workflows/restore-pre-today-ui-v094.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve current core hashes
        run: |
          sha256sum live-v091.js index.html scripts/update_latest.py > /tmp/core.before
      - name: Restore exact pre-today-chart extras
        run: |
          git fetch origin stable-v094-before-today-chart-fix-20261029
          git show origin/stable-v094-before-today-chart-fix-20261029:extras-v090.js > extras-v090.js
      - name: Validate restored display layer
        run: |
          node --check extras-v090.js
          grep -F "const VERSION='0.9.4';" extras-v090.js
          grep -F 'NEWS_FEEDS' extras-v090.js
          grep -F 'TRUSTED_GOOGLE_PUBLISHERS' extras-v090.js
          grep -F 'ensureDetailChartTabs' extras-v090.js
          grep -F "['today','今日']" extras-v090.js
          grep -F "['5','5日']" extras-v090.js
          grep -F "['20','20日']" extras-v090.js
          grep -F "['60','60日']" extras-v090.js
      - name: Confirm core unchanged
        run: |
          sha256sum live-v091.js index.html scripts/update_latest.py > /tmp/core.after
          diff -u /tmp/core.before /tmp/core.after
      - name: Confirm restore matches backup exactly
        run: |
          git show origin/stable-v094-before-today-chart-fix-20261029:extras-v090.js | sha256sum > /tmp/want
          sha256sum extras-v090.js > /tmp/got
          cut -d' ' -f1 /tmp/want > /tmp/want.hash
          cut -d' ' -f1 /tmp/got > /tmp/got.hash
          diff -u /tmp/want.hash /tmp/got.hash
      - name: Commit exact restore only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extras-v090.js
          git diff --cached --quiet && exit 0
          git commit -m 'Restore verified pre-today-chart UI layer'
          git push
