name: Verify v0.9.1 complete live acceptance
on:
  push:
    paths:
      - '.github/workflows/verify-v091-live.yml'
      - 'live-v091.js'
      - 'index.html'
      - 'sw.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static release checks
        run: |
          node --check live-v091.js
          node --check extras-v090.js
          grep -F "APP_VERSION='0.9.1'" index.html
          grep -F 'live-v091.js?v=091' index.html
          grep -F "tw-ai-monitor-v091" sw.js
          ! grep -F 'live-v090.js?v=090' index.html
          ! grep -E 'fix\.js\?v=|hotfix-v06[5-9]\.js\?v=|live-v081\.js\?v=' index.html
          ! grep -E '100dvh|-webkit-fill-available' index.html
      - name: Verify official current market payload
        run: |
          python - <<'PY'
          import json,urllib.parse,urllib.request,time
          from datetime import datetime
          from zoneinfo import ZoneInfo
          today=datetime.now(ZoneInfo('Asia/Taipei')).strftime('%Y%m%d')
          chans=['tse_t00.tw','tse_0050.tw','tse_3711.tw','tse_2002.tw','otc_3293.tw','tse_00878.tw','tse_00919.tw']
          u='https://mis.twse.com.tw/stock/api/getStockInfo.jsp?'+urllib.parse.urlencode({'ex_ch':'|'.join(chans),'json':'1','delay':'0','_':int(time.time()*1000)})
          req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache'})
          with urllib.request.urlopen(req,timeout=25) as r:j=json.loads(r.read().decode())
          arr=j.get('msgArray') or []
          def n(v):
              try:return float(str(v).replace(',',''))
              except:return None
          idx=[m for m in arr if str(m.get('c',''))=='t00']
          assert idx and str(idx[0].get('d',''))==today and n(idx[0].get('z')) is not None
          for code in ['0050','3711','2002','3293','00878','00919']:
              rows=[m for m in arr if str(m.get('c',''))==code and str(m.get('d',''))==today]
              assert rows, f'{code}: no current row'
              m=rows[0];live=n((m.get('trade') or {}).get('z')) or n(m.get('z'))
              assert live is not None, f'{code}: no current trade'
              print(code,'live',live,'time',(m.get('trade') or {}).get('t'),'yesterday',m.get('y'))
          print('OFFICIAL_CURRENT_PAYLOAD_PASS',today)
          PY
      - name: Wait for public v0.9.1
        run: |
          for i in $(seq 1 60); do
            H=$(curl -fsSL --max-time 10 "https://under855.github.io/twstock-ai-monitor/?verify091=$RANDOM" || true)
            J=$(curl -fsSL --max-time 10 "https://under855.github.io/twstock-ai-monitor/live-v091.js?v=091&verify=$RANDOM" || true)
            if echo "$H" | grep -q 'v0.9.1' && echo "$J" | grep -q "const VERSION='0.9.1'"; then echo PUBLIC_V091_READY; exit 0; fi
            sleep 4
          done
          echo 'public v0.9.1 not ready' >&2; exit 1
      - name: Install browser harness
        run: |
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          test -n "$CHROME"
          echo "CHROME=$CHROME" >> "$GITHUB_ENV"
          npm install --no-save playwright-core@latest
      - name: Mobile browser full live acceptance
        env:
          URL: https://under855.github.io/twstock-ai-monitor/
        run: |
          cat > qa091.mjs <<'JS'
          import { chromium } from 'playwright-core';
          const codes=['0050','3711','3293','2002','00878','00919'];
          const browser=await chromium.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox']});
          const ctx=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:3,isMobile:true,hasTouch:true,locale:'zh-TW',timezoneId:'Asia/Taipei',serviceWorkers:'allow'});
          const page=await ctx.newPage();
          const fatal=[];page.on('pageerror',e=>fatal.push('pageerror:'+e.message));
          await page.goto(process.env.URL+'?qa091='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForFunction(()=>document.title.includes('v0.9.1'),null,{timeout:30000});
          await page.waitForFunction(cs=>cs.every(c=>window.__TW_LIVE_V091__?.stocks?.[c]?.date),codes,{timeout:60000});
          await page.waitForFunction(cs=>cs.every(c=>(window.__TW_LIVE_V091__?.stocks?.[c]?.seriesPoints||0)>=2),codes,{timeout:60000});
          const today=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()).replaceAll('-','');
          async function snap(label){return page.evaluate(({label,codes})=>{const s=structuredClone(window.__TW_LIVE_V091__);const rows={};for(const c of codes){const r=[...document.querySelectorAll('#watch article.row')].find(x=>x.querySelector('.sym')?.textContent?.trim()===c);rows[c]=r?{state:r.dataset.liveState,date:r.dataset.liveDate,stamp:Number(r.dataset.liveStamp||0),price:r.dataset.livePrice,priceText:r.querySelector('.price')?.textContent||'',meta:r.querySelector('.meta')?.textContent||'',day:r.querySelector('.dayline')?.textContent||'',canvas:!!r.querySelector('canvas.spark')}:null}return{label,s,rows,title:document.title,taiex:document.getElementById('taiex')?.textContent||'',taiexText:document.getElementById('taiexChg')?.textContent||'',badge:document.getElementById('liveBadge')?.textContent||'',scrollWidth:document.documentElement.scrollWidth,innerWidth,scrollHeight:document.documentElement.scrollHeight,innerHeight}}, {label,codes})}
          function check(x){
            if(!x.title.includes('v0.9.1'))throw Error(`${x.label}: wrong version`);
            if(!x.s?.marketWindow)throw Error(`${x.label}: not market window`);
            if(x.s.taiex?.date!==today||!x.taiexText.includes('盤中即時'))throw Error(`${x.label}: TAIEX not current ${JSON.stringify(x.s.taiex)} ${x.taiexText}`);
            if(x.scrollWidth>x.innerWidth+2)throw Error(`${x.label}: horizontal overflow`);
            if(x.scrollHeight<=x.innerHeight)throw Error(`${x.label}: page cannot scroll`);
            for(const c of codes){const q=x.s.stocks[c],r=x.rows[c];
              if(!q||q.date!==today||!String(q.source||'').includes('MIS'))throw Error(`${x.label} ${c}: quote stale ${JSON.stringify(q)}`);
              if((q.seriesPoints||0)<2)throw Error(`${x.label} ${c}: no intraday line`);
              if(Number(q.seriesLastStamp)!==Number(q.stamp))throw Error(`${x.label} ${c}: chart tail != official live quote`);
              if(!r||r.state!=='live'||r.date!==today||!r.canvas)throw Error(`${x.label} ${c}: DOM not current ${JSON.stringify(r)}`);
              if(!r.meta.includes('MIS'))throw Error(`${x.label} ${c}: DOM source not MIS`);
              if(/昨日|最近交易日|官方快照|最近完成交易日/.test(r.meta+r.day))throw Error(`${x.label} ${c}: yesterday leaked into live DOM`);
              if(!r.priceText||r.priceText==='—')throw Error(`${x.label} ${c}: current price blank`);
            }
          }
          const a=await snap('A');check(a);
          await page.waitForTimeout(16500);const b=await snap('B');check(b);
          if(b.s.cycle<=a.s.cycle||b.s.lastPollAt<=a.s.lastPollAt)throw Error('first 15-second poll did not advance');
          await page.waitForTimeout(16500);const c=await snap('C');check(c);
          if(c.s.cycle<=b.s.cycle||c.s.lastPollAt<=b.s.lastPollAt)throw Error('second 15-second poll did not advance');
          if(Number(c.s.taiex?.stamp||0)<Number(a.s.taiex?.stamp||0))throw Error('TAIEX went backward');
          for(const code of codes)if(Number(c.s.stocks[code].stamp)<Number(a.s.stocks[code].stamp))throw Error(`${code}: live quote went backward`);
          const movedStocks=codes.filter(code=>Number(c.s.stocks[code].stamp)>Number(a.s.stocks[code].stamp));
          if(!movedStocks.length)throw Error('no monitored stock received a newer trade across two 15-second cycles');
          await page.evaluate(()=>scrollTo(0,document.documentElement.scrollHeight));await page.waitForTimeout(300);
          const bottom=await page.evaluate(()=>{const rows=[...document.querySelectorAll('#watch article.row')],r=rows.at(-1)?.getBoundingClientRect();return{code:rows.at(-1)?.querySelector('.sym')?.textContent?.trim(),top:r?.top,bottom:r?.bottom,ih:innerHeight,scrollY,doc:document.documentElement.scrollHeight}});
          if(!bottom.code||bottom.top<0||bottom.bottom>bottom.ih+2)throw Error('last watch row not reachable '+JSON.stringify(bottom));
          await page.evaluate(()=>scrollTo(0,0));
          await page.locator('#watch article.row').filter({hasText:'0050'}).click();await page.waitForSelector('#sheet.show',{timeout:10000});
          const detail=await page.evaluate(()=>({h:document.querySelector('#bigChart')?.closest('.card')?.querySelector('h3')?.textContent||'',time:document.getElementById('dTime')?.textContent||'',price:document.getElementById('dPrice')?.textContent||'',msg:document.getElementById('chartMsg')?.textContent||''}));
          if(detail.h!=='今日盤中即時走勢'||!detail.time.includes('MIS')||detail.price==='—'||!detail.msg.includes('今日盤中即時走勢'))throw Error('detail not live '+JSON.stringify(detail));
          await page.locator('#closeBtn').click();
          await page.evaluate(()=>navigator.serviceWorker.ready.then(()=>true));await page.reload({waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForFunction(()=>document.title.includes('v0.9.1')&&window.__TW_LIVE_V091__?.cycle>=1,null,{timeout:60000});
          await page.waitForFunction(cs=>cs.every(c=>window.__TW_LIVE_V091__?.stocks?.[c]?.date),codes,{timeout:60000});const r=await snap('reload');check(r);
          if(fatal.length)throw Error('page errors '+JSON.stringify(fatal));
          console.log('V091_FULL_ACCEPTANCE_PASS',JSON.stringify({cycles:[a.s.cycle,b.s.cycle,c.s.cycle],movedStocks,taiex:[a.s.taiex?.time,c.s.taiex?.time],bottom,detail}));
          await browser.close();
          JS
          timeout 180s node qa091.mjs
