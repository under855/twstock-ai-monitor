name: Finalize v0.9.4 and full acceptance

on:
  push:
    paths:
      - '.github/workflows/finalize-v094.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Consolidate and statically verify
        run: python3 scripts/finalize_v094.py

      - name: Mobile browser acceptance
        run: |
          npm install --no-save playwright-core@latest >/dev/null 2>&1
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          test -n "$CHROME"
          export CHROME
          node scripts/accept_v094.mjs

      - name: Commit only after all checks pass
        run: |
          if git diff --quiet -- index.html 404.html extras-v090.js live-v091.js sw.js; then
            echo 'No runtime changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html 404.html extras-v090.js live-v091.js sw.js
          git commit -m 'Consolidate and verify v0.9.4 final'
          git push
