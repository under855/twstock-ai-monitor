name: Probe Nasdaq browser access
on:
  push:
    branches: ['source-migration-no-yahoo-20261030']
    paths: ['.github/workflows/probe-nasdaq-browser.yml']
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Browser probe
        shell: bash
        run: |
          npm install --no-save playwright-core@latest >/dev/null 2>&1
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser); export CHROME
          cat > probe.mjs <<'JS'
          import {chromium} from 'playwright-core';
          const b=await chromium.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox']});
          const p=await b.newPage();
          await p.goto('https://under855.github.io/twstock-ai-monitor/',{waitUntil:'domcontentloaded',timeout:60000});
          const urls=[
            'https://api.nasdaq.com/api/quote/NVDA/info?assetclass=stocks',
            'https://api.allorigins.win/raw?url='+encodeURIComponent('https://api.nasdaq.com/api/quote/NVDA/info?assetclass=stocks'),
            'https://r.jina.ai/https://api.nasdaq.com/api/quote/NVDA/info?assetclass=stocks'
          ];
          for(const url of urls){
            const x=await p.evaluate(async u=>{try{const r=await fetch(u,{cache:'no-store'});return {u,status:r.status,ok:r.ok,type:r.type,text:(await r.text()).slice(0,600)}}catch(e){return {u,error:String(e)}}},url);
            console.log(JSON.stringify(x));
          }
          await b.close();
          JS
          node probe.mjs
