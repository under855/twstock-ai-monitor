name: Capture official TWSE MIS intraday
on:
  schedule:
    - cron: '*/5 1-4 * * 1-5'
    - cron: '0-35/5 5 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capture-intraday-official.yml'
      - 'scripts/capture_intraday.py'
permissions:
  contents: write
concurrency:
  group: official-intraday-capture
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture TWSE MIS and store on market-data branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin market-data main
          git checkout market-data
          mkdir -p scripts data/intraday
          git show origin/main:scripts/capture_intraday.py > scripts/capture_intraday.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Keep the already-approved five-minute capture cadence even when scheduled starts are delayed.
          # Concurrency prevents overlapping sessions. Stop on holidays and at market close.
          while python scripts/capture_intraday.py --market-open; do
            if python scripts/capture_intraday.py; then
              git add data/intraday/latest.json
              if git diff --cached --quiet; then
                echo 'No new official MIS timestamp.'
              else
                git commit -m 'Capture official TWSE MIS intraday snapshot'
                git push origin HEAD:market-data
              fi
            else
              echo '::warning::Official MIS capture failed; retry at next existing five-minute boundary.'
            fi
            sleep "$((300 - $(date +%s) % 300))"
          done
          rm -f scripts/capture_intraday.py
