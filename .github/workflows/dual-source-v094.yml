name: Add dual-source resilience v0.9.4
on:
  push:
    paths:
      - 'scripts/patch_dual_source_v094.py'
      - '.github/workflows/dual-source-v094.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply dual-source patch
        run: python scripts/patch_dual_source_v094.py
      - name: Static verification
        run: |
          node --check live-v091.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('live-v091.js').read_text(encoding='utf-8')
          checks={
            'version unchanged':"const VERSION='0.9.4';" in s,
            'backup interval':'const BACKUP_INTERVAL=60000;' in s,
            'backup fetch':"./data/latest.json?_=" in s,
            'freshness arbitration':'newerOrEqual(oldv,newv)' in s,
            'MIS preferred on tie':"/MIS/.test(String(src||''))?2:1" in s,
            'fallback on MIS failure':'await pollBackup(true)' in s,
            'startup parallel':'poll(true);pollBackup(true);' in s,
            '15 second MIS':'const INTERVAL=15000;' in s,
          }
          print(checks)
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('FAILED '+', '.join(bad))
          PY
      - name: Verify live file and backup data contract
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('data/latest.json').read_text(encoding='utf-8'))
          for code in ['0050','3711','3293','2002','00878','00919']:
              x=j['symbols'][code]
              assert x.get('tradeDate'), code
              assert x.get('close') is not None, code
          assert j.get('taiex',{}).get('close') is not None
          print('backup contract ok', j['tradeDate'], j['taiex']['close'])
          PY
      - name: Commit only after checks pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add live-v091.js
          if git diff --cached --quiet; then
            echo 'No runtime change'
            exit 0
          fi
          git commit -m 'Add dual-source market data fallback to v0.9.4'
          git push
