name: Update latest official market data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_latest.py'
      - '.github/workflows/update-latest.yml'
  schedule:
    # 08:00–15:59 Taiwan local, weekdays. Final 13:30 official close is included.
    - cron: '*/5 0-7 * * 1-5'
    # TPEx official close may appear after 16:00 Taiwan time; retry without rewriting unchanged data.
    - cron: '*/10 8-10 * * 1-5'

permissions:
  contents: write

concurrency:
  group: update-latest-main
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and publish official market data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch --no-tags origin main
            base=$(git rev-parse FETCH_HEAD)
            # This checkout belongs to the runner. Regenerate on the current main.
            git reset --hard "$base"
            python scripts/update_latest.py
            git add -- data/latest.json
            if git diff --cached --quiet; then
              echo "No data change"
              exit 0
            fi

            git commit -m "Update official latest market data"
            if git push origin HEAD:refs/heads/main; then
              exit 0
            fi

            git fetch --no-tags origin main
            if [[ "$(git rev-parse FETCH_HEAD)" == "$base" || "$attempt" == 3 ]]; then
              echo "::error::Could not publish official market data (attempt $attempt)."
              exit 1
            fi
            echo "main advanced during publication; regenerating against its new tip."
            sleep "$attempt"
          done
