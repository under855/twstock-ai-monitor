name: Probe COVER Google Finance fields
on:
  push:
    branches: ['source-migration-no-yahoo-20261030']
    paths: ['.github/workflows/probe-cover-html-fields.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Jina text view
        shell: bash
        run: |
          curl -L --max-time 30 -sS 'https://r.jina.ai/https://www.google.com/finance/quote/5253:TYO?hl=en&_='$(date +%s) -o /tmp/cover.txt
          head -c 12000 /tmp/cover.txt
