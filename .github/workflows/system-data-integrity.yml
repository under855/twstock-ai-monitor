name: Verify critical system data integrity
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'live-v091.js'
      - 'index.html'
      - 'gold-oil-board.js'
      - 'scripts/verify_gold_oil_board.mjs'
      - 'scripts/update_gold_oil.py'
      - 'detail-candles-pilot.js'
      - 'scripts/verify_detail_candles_pilot.mjs'
      - 'scripts/verify_intraday_failover.mjs'
      - 'scripts/verify_staggered_market_hours.mjs'
      - 'scripts/verify_intraday_failover_browser.mjs'
      - 'scripts/audit_preopen_sources.mjs'
      - 'scripts/verify_official_close_fallback_browser.mjs'
      - 'scripts/probe_live_browser.mjs'
      - '.github/workflows/system-data-integrity.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/system_data_audit.mjs'
      - 'scripts/verify_live_feed.mjs'
      - 'scripts/verify_intraday_failover.mjs'
      - 'scripts/verify_staggered_market_hours.mjs'
      - 'scripts/verify_intraday_failover_browser.mjs'
      - 'scripts/audit_preopen_sources.mjs'
      - 'scripts/probe_live_browser.mjs'
      - 'foreign-flow-card.js'
      - 'data/foreign-flow.json'
      - 'scripts/update_foreign_flow.py'
      - 'index.html'
      - 'gold-oil-board.js'
      - 'scripts/verify_gold_oil_board.mjs'
      - 'scripts/update_gold_oil.py'
      - 'detail-candles-pilot.js'
      - 'scripts/verify_detail_candles_pilot.mjs'
      - 'sw.js'
      - 'live-v091.js'
      - 'foreign-live-test.js'
      - 'split-layout-v095.js'
      - 'paper-trading-v100.js'
      - 'pilot-chart-00878-v1.js'
      - 'paper-trading-reset-v101.js'
      - 'dividend-enhance.js'
      - 'extras-v090.js'
      - '.github/workflows/system-data-integrity.yml'
  # Source-independent regression checks now run during exchange preopen preview.
  schedule:
    # Daily 00:10 Asia/Taipei (previous UTC day at 16:10); read-only full regression.
    - cron: '10 16 * * *'
    # Weekday 08:40 Asia/Taipei preopen verification remains unchanged.
    - cron: '40 0 * * 1-5'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify no orphaned old patches or released deployment markers
        run: |
          node <<'JS'
          const fs=require('node:fs');
          const path=require('node:path');
          const scripts=fs.readdirSync('scripts');
          const illegal=scripts.filter(x=>/^(?:patch_|fix_|finalize_|final_fx)/.test(x));
          if(illegal.length)throw Error('Obsolete source patchers remain: '+illegal.join(', '));
          const files=fs.readdirSync('.');
          const markers=files.filter(x=>/^deploy-v\d+/i.test(x)||x==='README.txt');
          if(markers.length)throw Error('Retired release markers remain: '+markers.join(', '));
          const html=fs.readFileSync('index.html','utf8');
          for(const match of html.matchAll(/<script\b[^>]*\bsrc=["']([^"']+)["']/gi)){
            const src=match[1];if(/^(?:https?:)?\/\//.test(src))continue;
            const clean=src.replace(/^\.\//,'').split(/[?#]/)[0];
            if(!fs.existsSync(clean))throw Error('Active script is missing: '+clean);
          }
          for(const critical of ['data/latest.json','data/dividends.json','scripts/update_latest.py','scripts/update_dividends.py','scripts/capture_intraday.py','scripts/audit_preopen_sources.mjs']){
            if(!fs.existsSync(critical))throw Error('Required market/scoring source removed: '+critical);
          }
          console.log('REPOSITORY_CLEANUP_PASS');
          JS
      - name: Verify preopen source audit logic without assuming simulated price is a real fill
        run: node scripts/audit_preopen_sources.mjs --self-test
      - name: Syntax check loaded modules
        run: |
          for f in live-v091.js foreign-live-test.js split-layout-v095.js paper-trading-v100.js paper-trading-reset-v101.js pilot-chart-00878-v1.js extras-v090.js dividend-enhance.js foreign-flow-card.js sw.js; do
            node --check "$f"
          done
      - name: Verify detail-only K line pilot
        run: |
          node --check detail-candles-pilot.js
          node scripts/verify_detail_candles_pilot.mjs
      - name: Validate official gold and oil cards independently
        run: |
          python scripts/update_gold_oil.py --self-test
          node --check gold-oil-board.js
          node scripts/verify_gold_oil_board.mjs
      - name: Verify official BOT and CPC production formats before release
        if: github.event_name == 'pull_request'
        run: |
          python scripts/update_gold_oil.py
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('data/gold-oil.json').read_text('utf-8'))
          assert data.get('gold') and data.get('oil'), 'GOLD_OIL_OFFICIAL_SOURCES_NOT_BOTH_VERIFIED'
          print('GOLD_OIL_LIVE_OFFICIAL_SOURCES_PASS')
          PY
      - name: Verify delayed-source protection and MIS backoff
        run: node scripts/verify_live_feed.mjs
      - name: Verify independently polled MIS snapshot failover
        run: node scripts/verify_intraday_failover.mjs
      - name: Verify staggered primary and secondary, closed-market suspension
        run: node scripts/verify_staggered_market_hours.mjs
      - name: Prepare browser checks
        run: npm install --no-save playwright-core@latest
      - name: Exercise real browser with mocked primary and backup quotes
        run: |
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          export CHROME
          node scripts/verify_intraday_failover_browser.mjs
      - name: Test staged live MIS requests in real production-like browser
        if: github.event_name == 'pull_request'
        run: |
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          export CHROME
          PROBE_OVERRIDE_JS=1 node scripts/probe_live_browser.mjs
      - name: Verify dated official close fallback when both browser gateways fail
        run: |
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          export CHROME
          node scripts/verify_official_close_fallback_browser.mjs
      - name: Validate current production after deployment
        if: github.event_name != 'pull_request' && github.event_name != 'schedule'
        run: |
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          export CHROME
          sleep 15
          node scripts/system_data_audit.mjs
