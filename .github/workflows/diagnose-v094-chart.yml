name: Diagnose v0.9.4 chart rendering
on:
  push:
    paths:
      - '.github/workflows/diagnose-v094-chart.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright-core@latest >/dev/null 2>&1
      - name: Inspect production chart pixels and live series
        env:
          URL: https://under855.github.io/twstock-ai-monitor/
        run: |
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser); export CHROME
          cat > chartdiag.mjs <<'JS'
          import { chromium } from 'playwright-core';
          const b=await chromium.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox']});
          const ctx=await b.newContext({viewport:{width:390,height:844},deviceScaleFactor:3,isMobile:true,hasTouch:true,timezoneId:'Asia/Taipei',locale:'zh-TW',serviceWorkers:'allow'});
          const p=await ctx.newPage();
          const errs=[];p.on('pageerror',e=>errs.push(e.message));p.on('console',m=>{if(m.type()==='error')errs.push(m.text())});
          await p.goto(process.env.URL+'?chartdiag='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
          await p.waitForTimeout(35000);
          const out=await p.evaluate(()=>{
            function canvasInk(c){if(!c)return null;try{const x=c.getContext('2d').getImageData(0,0,c.width,c.height).data;let n=0;for(let i=3;i<x.length;i+=4)if(x[i]>0)n++;return n}catch{return -1}}
            return {
              title:document.title,
              live:window.__TW_LIVE_V091__||null,
              rows:[...document.querySelectorAll('#watch article.row')].map(r=>{const c=r.querySelector('canvas.spark');return {code:r.querySelector('.sym')?.textContent?.trim(),hasCanvas:!!c,w:c?.width||0,h:c?.height||0,ink:canvasInk(c),text:r.querySelector('.sparkFallback')?.textContent||''}})
            }
          });
          out.errors=errs;
          console.log(JSON.stringify(out,null,2));
          await b.close();
          JS
          node chartdiag.mjs
