name: Patch Taiwan Bank cash FX parser
on:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/sync-refresh-cadence-20261103.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Patch parser and cache key
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('split-layout-v095.js')
          s=p.read_text(encoding='utf-8')
          old="""  function parseBot(html){const doc=new DOMParser().parseFromString(html,'text/html'),rows=[];for(const tr of doc.querySelectorAll('table tbody tr')){const text=(tr.textContent||'').replace(/\\s+/g,' ').trim();const m=text.match(/\\(([A-Z]{3})\\)/);if(!m||!CURRENCIES.includes(m[1]))continue;const nums=[...tr.querySelectorAll('td')].map(td=>(td.textContent||'').trim()).filter(x=>/^-?\\d+(\\.\\d+)?$/.test(x));if(nums.length>=2)rows.push({code:m[1],buy:nums[0],sell:nums[1]});}const body=(doc.body?.textContent||'').replace(/\\s+/g,' ');const tm=body.match(/牌價最新掛牌時間[：:]\\s*([^取幣]+?)(?=幣別|$)/);return {rows,time:tm?tm[1].trim():''};}
"""
          new="""  function parseBot(html){
    const doc=new DOMParser().parseFromString(html,'text/html'),rows=[];
    const clean=v=>String(v??'').trim();
    const valid=v=>/^\\d+(?:\\.\\d+)?$/.test(v);
    for(const tr of doc.querySelectorAll('table tbody tr')){
      const text=(tr.textContent||'').replace(/\\s+/g,' ').trim();
      const m=text.match(/\\(([A-Z]{3})\\)/);if(!m||!CURRENCIES.includes(m[1]))continue;
      const buy=clean(tr.querySelector('td[data-table="本行現金買入"]')?.textContent);
      const sell=clean(tr.querySelector('td[data-table="本行現金賣出"]')?.textContent);
      if(valid(buy)&&valid(sell))rows.push({code:m[1],buy,sell});
    }
    const body=(doc.body?.textContent||'').replace(/\\s+/g,' '),tm=body.match(/牌價最新掛牌時間[：:]\\s*([^取幣]+?)(?=幣別|$)/);
    return {rows,time:tm?tm[1].trim():''};
  }
"""
          if old not in s:
              raise SystemExit('old parser not found')
          p.write_text(s.replace(old,new),encoding='utf-8')

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'split-layout-v095.js?v=095sync2' not in s:
              raise SystemExit('split cache key not found')
          p.write_text(s.replace('split-layout-v095.js?v=095sync2','split-layout-v095.js?v=095sync3'),encoding='utf-8')
          PY
          node --check split-layout-v095.js
          grep -q 'data-table="本行現金買入"' split-layout-v095.js
          grep -q 'data-table="本行現金賣出"' split-layout-v095.js
          grep -q 'split-layout-v095.js?v=095sync3' index.html
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add split-layout-v095.js index.html
          git commit -m 'Fix Taiwan Bank cash FX column parsing'
          git pull --rebase origin main
          git push origin HEAD:main
