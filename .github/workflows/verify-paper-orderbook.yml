name: Verify paper trading order-book matching
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'paper-trading-v100.js'
      - '.github/workflows/verify-paper-orderbook.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check paper-trading-v100.js
      - name: Test bid/ask limits and ledger
        run: |
          node <<'JS'
          const fs=require('fs'),vm=require('vm'),assert=require('assert/strict');
          let src=fs.readFileSync('paper-trading-v100.js','utf8');
          assert(src.includes('})();'));
          src=src.replace(/\}\)\(\);\s*$/, 'globalThis.__qa={trade,priceNum,onTick,fetchOrderBook,account:()=>acct};})();');
          const frozen=Date.parse('2026-11-09T02:00:00Z');
          const FixedDate=class extends Date{
            constructor(...args){super(...(args.length?args:[frozen]))}
            static now(){return frozen}
          };
          const storage=new Map();
          const doc={readyState:'loading',addEventListener(){},querySelectorAll(){return[]},getElementById(){return null}};
          const c={
            Date:FixedDate,Intl,Number,String,Array,Object,Map,Math,JSON,Promise,Error,RegExp,
            setTimeout,clearTimeout,document:doc,window:{},crypto:{randomUUID:()=>String(Math.random())},
            localStorage:{getItem:key=>storage.get(key)||null,setItem:(key,value)=>storage.set(key,value)},
            universeMap:new Map([['2330',{market:'TWSE',name:'測試股'}],['00878',{market:'TWSE',name:'測試ETF'}]]),
            loadFullUniverse:async()=>{},stockName:(c)=>c,rowForCode:(c)=>({Code:c})
          };
          let quote={c:'2330',ex:'tse',d:'20261109',tlong:String(frozen),t:'10:00:00',a:'100.5_101_102_',b:'100_99.5_99_',f:'4_10_12_',g:'20_9_8_'};
          c.fetch=async()=>({ok:true,json:async()=>({msgArray:[quote]})});
          vm.createContext(c);vm.runInContext(src,c,{timeout:3000});
          (async()=>{
            const qa=c.__qa;
            assert.equal(qa.onTick(33.48,true),true);
            assert.equal(qa.onTick(33.48,false),false);
            await assert.rejects(()=>qa.trade('BUY','2330',1000,'1'),/沒有成交/);
            assert.equal(qa.account().cash,1000000);
            await assert.rejects(()=>qa.trade('BUY','2330',100,'100.5'),/零股/);
            assert.equal(qa.account().cash,1000000);
            await assert.rejects(()=>qa.trade('BUY','2330',5000,'101'),/可見委託量不足/);
            const buy=await qa.trade('BUY','2330',1000,'100.5');
            assert.equal(buy.price,100.5);
            assert.equal(qa.account().positions['2330'].shares,1000);
            assert.equal(qa.account().trades[0].price,100.5);
            await assert.rejects(()=>qa.trade('SELL','2330',1000,'101'),/沒有成交/);
            assert.equal(qa.account().positions['2330'].shares,1000);
            const sell=await qa.trade('SELL','2330',1000,'100');
            assert.equal(sell.price,100);
            assert.equal(qa.account().positions['2330'].shares,0);
            assert.equal(qa.account().trades.length,2);
            console.log('PAPER_ORDERBOOK_PASS: limit guard, no fabricated fills, liquidity, balances, bid/ask and ETF ticks');
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
