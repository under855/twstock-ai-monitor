name: Probe MIS live sources v083
on:
  push:
    paths:
      - '.github/workflows/probe-mis-live-v083.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe exact v090 channels through all paths
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request, time
          from datetime import datetime
          from zoneinfo import ZoneInfo
          today=datetime.now(ZoneInfo('Asia/Taipei')).strftime('%Y%m%d')
          codes=['0050','3711','2002','3293','00878','00919']
          chans=['tse_t00.tw']
          for c in codes:
              chans += [f'tse_{c}.tw',f'otc_{c}.tw']
          params={'ex_ch':'|'.join(chans),'json':'1','delay':'0','_':int(time.time()*1000)}
          upstream='https://mis.twse.com.tw/stock/api/getStockInfo.jsp?'+urllib.parse.urlencode(params)
          paths=[('direct',upstream),('corsdev','https://proxy.cors.dev/'+upstream),('allorigins','https://api.allorigins.win/raw?url='+urllib.parse.quote(upstream,safe=''))]
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=30) as r:return json.loads(r.read().decode('utf-8'))
          for name,url in paths:
              try:
                  j=get(url); arr=j.get('msgArray') or []
                  print('\nPATH',name,'rows',len(arr),'rt',j.get('rtcode'),j.get('rtmessage'))
                  for m in arr:
                      c=str(m.get('c','')); tr=m.get('trade') or {}
                      print(c,'ex',m.get('ex'),'d',m.get('d'),'z',m.get('z'),'trade.z',tr.get('z'),'trade.t',tr.get('t'),'y',m.get('y'))
                  present={str(m.get('c','')) for m in arr if str(m.get('d',''))==today}
                  print('TODAY_PRESENT',sorted(present))
              except Exception as e:
                  print('\nPATH',name,'ERROR',repr(e))
          PY
