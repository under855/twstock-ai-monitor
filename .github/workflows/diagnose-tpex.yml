name: Diagnose TPEx daily-close formats
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-tpex.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Display official TPEx response shapes, dates and 3293 rows
        run: |
          python - <<'PY'
          import urllib.request,json,urllib.parse
          day='2026/11/11'
          urls=[
            'https://www.tpex.org.tw/www/zh-tw/afterTrading/dailyQuotes?'+urllib.parse.urlencode({'date':day,'response':'json'}),
            'https://www.tpex.org.tw/www/zh-tw/afterTrading/otc?'+urllib.parse.urlencode({'date':day,'response':'json'}),
            'https://www.tpex.org.tw/openapi/v1/tpex_mainboard_daily_close_quotes',
            'https://www.tpex.org.tw/openapi/v1/tpex_mainboard_quotes',
          ]
          for url in urls:
            print('\nURL',url,flush=True)
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=18) as r: j=json.load(r)
              print('TOP',str(type(j)),list(j.keys()) if isinstance(j,dict) else 'length '+str(len(j)),flush=True)
              if isinstance(j,dict):
                print('META',str({k:v for k,v in j.items() if k!='tables' and k!='data'})[:500],flush=True)
                for i,t in enumerate(j.get('tables',[])[:4]):
                  print('TABLE',i,{'title':t.get('title'),'date':t.get('date'),'fields':t.get('fields'),'count':len(t.get('data',[]))},flush=True)
                  rows=t.get('data',[])
                  print('ROW',str(rows[0])[:450] if rows else '',flush=True)
                  for row in rows:
                    if isinstance(row,list) and row and str(row[0]).strip()=='3293':
                      print('FOUND3293',row[:10],flush=True);break
                for row in j.get('data',[])[:2]: print('DATA',str(row)[:350])
              else:
                print('SAMPLE',str(j[:2])[:600],flush=True)
                for row in j:
                  if isinstance(row,dict) and ('3293' in str(list(row.values())[:3])):
                    print('FOUND3293',str(row)[:800],flush=True);break
            except Exception as e: print('ERROR',repr(e),flush=True)
          PY
          python - <<'PY'
          import urllib.request,json,time
          u='https://mis.twse.com.tw/stock/api/getStockInfo.jsp?ex_ch=otc_3293.tw&json=1&delay=0&_='+str(int(time.time()*1000))
          try:
            with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=12) as r:j=json.load(r)
            print('MIS_3293',json.dumps((j.get('msgArray') or [None])[0],ensure_ascii=False)[:1100])
          except Exception as e:print('MIS_ERROR',str(e))
          PY
