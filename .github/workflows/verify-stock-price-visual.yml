name: Verify stock price fonts and colors
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-stock-price-visual.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright-core@latest
      - name: Verify computed font sizes and movement colors
        run: |
          cat > check-stock-visual.mjs <<'JS'
          import { chromium } from 'playwright-core';
          import assert from 'node:assert/strict';
          const browser=await chromium.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox']});
          try {
            for(const width of [390,1280]){
              const page=await browser.newPage({viewport:{width,height:900},timezoneId:'Asia/Taipei'});
              await page.goto('https://under855.github.io/twstock-ai-monitor/?stockColorQa='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
              const result=await page.evaluate(async ()=>{
                const watch=document.getElementById('watch');
                const fixture=document.createElement('article');fixture.className='row';
                fixture.innerHTML='<div class="p"><div class="price">100.00</div><div class="chg">+3.50</div></div>';
                watch.appendChild(fixture);
                await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
                const p=fixture.querySelector('.price'),c=fixture.querySelector('.chg');
                const snap=()=>({price:getComputedStyle(p).color,change:getComputedStyle(c).color,font:parseFloat(getComputedStyle(p).fontSize),changeFont:parseFloat(getComputedStyle(c).fontSize)});
                const up=snap();
                c.textContent='-2.50';
                await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
                const down=snap();
                c.textContent='0.00';
                await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
                const flat=snap();
                fixture.remove();
                return {up,down,flat};
              });
              console.log('STOCK_VISUAL',width,JSON.stringify(result));
              assert.equal(result.up.price,'rgb(255, 66, 66)');
              assert.equal(result.down.price,'rgb(33, 200, 107)');
              assert.equal(result.flat.price,'rgb(238, 244, 251)');
              assert.equal(result.up.price,result.up.change);
              assert.equal(result.down.price,result.down.change);
              assert.ok(result.up.font>=27);
              assert.ok(result.up.changeFont>=15);
              await page.close();
            }
          } finally {await browser.close()}
          JS
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          export CHROME
          node check-stock-visual.mjs
