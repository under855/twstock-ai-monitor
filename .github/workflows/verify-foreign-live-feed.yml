name: Verify foreign live feed
on:
  push:
    branches: ['feature-live-validation-20261030']
    paths: ['.github/workflows/verify-foreign-live-feed.yml']
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Poll 0700.HK five times
        run: |
          python - <<'PY'
          import json,time,urllib.request,datetime,zoneinfo
          tz=zoneinfo.ZoneInfo('Asia/Taipei')
          u='https://query1.finance.yahoo.com/v8/finance/chart/0700.HK?range=1d&interval=1m&includePrePost=false'
          last_time=None
          changes=0
          samples=[]
          for n in range(5):
              req=urllib.request.Request(u+'&_='+str(int(time.time()*1000)),headers={'User-Agent':'Mozilla/5.0'})
              try:
                  with urllib.request.urlopen(req,timeout=15) as r: j=json.load(r)
              except Exception:
                  req=urllib.request.Request('https://proxy.cors.dev/'+u+'&_='+str(int(time.time()*1000)),headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req,timeout=15) as r: j=json.load(r)
              x=j['chart']['result'][0]
              m=x.get('meta') or {}
              ts=x.get('timestamp') or []
              q=(x.get('indicators',{}).get('quote') or [{}])[0]
              last_ts=ts[-1] if ts else None
              last_close=(q.get('close') or [None])[-1]
              rt=m.get('regularMarketTime')
              rp=m.get('regularMarketPrice')
              rt_text=datetime.datetime.fromtimestamp(rt,tz).strftime('%H:%M:%S') if rt else None
              lt_text=datetime.datetime.fromtimestamp(last_ts,tz).strftime('%H:%M:%S') if last_ts else None
              row={'sample':n+1,'regularMarketPrice':rp,'regularMarketTime':rt_text,'lastBarTime':lt_text,'lastBarClose':last_close}
              samples.append(row)
              print(json.dumps(row,ensure_ascii=False))
              if last_time is not None and rt and rt>last_time: changes+=1
              if rt: last_time=rt
              if n<4: time.sleep(15)
          print('ADVANCES',changes)
          if not any(s['regularMarketPrice'] is not None for s in samples): raise SystemExit('no market price')
          if not any(s['regularMarketTime'] for s in samples): raise SystemExit('no market timestamp')
          PY
