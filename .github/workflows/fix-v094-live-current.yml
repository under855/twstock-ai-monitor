name: Fix v0.9.4 current market data
on:
  push:
    paths:
      - '.github/workflows/fix-v094-live-current.yml'
      - 'scripts/fix_v094_current.py'
      - 'scripts/accept_live_v094.mjs'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply consolidated runtime repair
        run: python3 scripts/fix_v094_current.py
      - name: Static correctness checks
        run: |
          node --check live-v091.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('live-v091.js').read_text(encoding='utf-8')
          checks={
            'still v0.9.4':"const VERSION='0.9.4';" in s,
            '15 sec':"const INTERVAL=15000;" in s,
            'forced post-close MIS':'poll(true)' in s,
            'market interval':'setInterval(()=>poll(false),INTERVAL)' in s,
            'today repaint':'marketOpen()||hasTodayData()' in s,
            'Yahoo removed from live path':'query1.finance.yahoo.com' not in s,
            'AllOrigins removed from live path':'allorigins.win' not in s,
            'history canvas protected':"canvas.dataset.history==='1'" in s,
          }
          print(checks)
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('FAILED '+', '.join(bad))
          PY
      - name: Browser acceptance for 15-second propagation
        run: |
          npm install --no-save playwright-core@latest >/dev/null 2>&1
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/server.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          export CHROME
          TEST_URL='http://127.0.0.1:8000/?liveaccept=1' node scripts/accept_live_v094.mjs
      - name: Commit only after all checks pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add live-v091.js
          git diff --cached --quiet && exit 0
          git commit -m 'Fix v0.9.4 current market data refresh'
          git push
