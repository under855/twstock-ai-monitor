name: Verify v079 live quotes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'hotfix-v079.js'
      - 'sw.js'
      - '.github/workflows/verify-v079.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check hotfix-v079.js
      - name: Verify batch TWSE MIS live quotes through CORS proxy
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.parse
          codes=['0050','3711','2002','2330','3293']
          channels=[]
          for c in codes:
              channels += [f'tse_{c}.tw',f'otc_{c}.tw']
          upstream='https://mis.twse.com.tw/stock/api/getStockInfo.jsp?ex_ch='+urllib.parse.quote('|'.join(channels),safe='')+'&json=1&delay=0'
          url='https://proxy.cors.dev/'+upstream
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json','Origin':'https://under855.github.io'})
          with urllib.request.urlopen(req,timeout=20) as r:
              j=json.loads(r.read().decode('utf-8-sig'))
              cors=r.headers.get('Access-Control-Allow-Origin')
          arr=j.get('msgArray') or []
          print('SAMPLE',json.dumps(arr[:4],ensure_ascii=False))
          if cors not in ('*','https://under855.github.io'):
              raise SystemExit('CORS unavailable')
          usable={}
          for x in arr:
              c=str(x.get('c') or '')
              if not c: continue
              z=x.get('z')
              a=(str(x.get('a') or '').split('_') or [''])[0]
              b=(str(x.get('b') or '').split('_') or [''])[0]
              px=z if z not in (None,'','-','--') else (a if a not in ('','-','--') else b)
              if px not in (None,'','-','--'):
                  usable[c]={'px':px,'z':z,'a':a,'b':b,'t':x.get('t'),'d':x.get('d'),'ch':x.get('ch')}
          print(json.dumps({'cors':cors,'count':len(arr),'usable':usable},ensure_ascii=False))
          must=['0050','3711','2002','2330','3293']
          missing=[c for c in must if c not in usable]
          if missing:
              raise SystemExit('Missing usable live symbols: '+','.join(missing))
          print('V079_BATCH_MIS_PASS')
          PY
