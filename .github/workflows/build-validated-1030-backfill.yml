name: Audit 2026-10-30 intraday backfill
on:
  push:
    branches: ['prod-verify-no-yahoo-20261030']
    paths: ['.github/workflows/build-validated-1030-backfill.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: 'prod-verify-no-yahoo-20261030'}
      - name: Audit all 8 HiStock minute paths against official daily OHLC
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request,urllib.parse,json,datetime,pathlib,http.cookiejar
          TZ=datetime.timezone(datetime.timedelta(hours=8)); UTC=datetime.timezone.utc; DAY='2026-10-30'; UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130 Safari/537.36'
          codes=['2330','009817','0050','3711','3293','2002','00878','00919']
          def plain_json(u):
            req=urllib.request.Request(u,headers={'User-Agent':UA,'Accept':'application/json,text/plain,*/*'})
            with urllib.request.urlopen(req,timeout=30) as r:return json.loads(r.read().decode('utf-8-sig','replace'))
          def histock(code):
            cj=http.cookiejar.CookieJar();op=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj));page=f'https://histock.tw/stock/{code}'
            op.open(urllib.request.Request(page,headers={'User-Agent':UA}),timeout=30).read()
            req=urllib.request.Request(f'https://histock.tw/stock/module/stockdata.aspx?no={code}',headers={'User-Agent':UA,'Referer':page,'Accept':'application/json,text/javascript,*/*;q=0.01','X-Requested-With':'XMLHttpRequest'})
            with op.open(req,timeout=30) as r:return json.loads(r.read().decode('utf-8-sig','replace'))
          def n(v):
            try:return float(str(v).replace(',','').replace('+','').strip())
            except:return None
          def official(code):
            if code=='3293':
              j=plain_json('https://www.tpex.org.tw/www/zh-tw/afterTrading/tradingStock?code=3293&date='+urllib.parse.quote('2026/10/01')+'&response=json')
              for r in j['tables'][0]['data']:
                if str(r[0]).endswith('/10/30'):return {'open':n(r[3]),'high':n(r[4]),'low':n(r[5]),'close':n(r[6])}
            else:
              j=plain_json(f'https://www.twse.com.tw/exchangeReport/STOCK_DAY?response=json&date=20261001&stockNo={code}')
              for r in j.get('data',[]):
                if str(r[0]).endswith('/10/30'):return {'open':n(r[3]),'high':n(r[4]),'low':n(r[5]),'close':n(r[6])}
            raise RuntimeError('official row not found '+code)
          audit=[]
          for code in codes:
            try:
              j=histock(code);raw=json.loads(j['data'].replace(',]',']'));vals=[];times=[]
              for source_ts,price in raw:
                wall=datetime.datetime.fromtimestamp(source_ts/1000,UTC)
                if wall.strftime('%Y-%m-%d')==DAY and datetime.time(9,0)<=wall.time()<=datetime.time(13,30):
                  vals.append(float(price));times.append(wall.strftime('%H:%M:%S'))
              o=official(code)
              if not vals: raise RuntimeError('no intraday points')
              obs={'min':min(vals),'max':max(vals),'last':vals[-1],'first':vals[0]}
              row={'code':code,'points':len(vals),'official':o,'observed':obs,'low_gap':round(obs['min']-o['low'],6),'high_gap':round(o['high']-obs['max'],6),'close_gap':round(obs['last']-o['close'],6),'within_official_range':obs['min']>=o['low'] and obs['max']<=o['high'],'close_exact':abs(obs['last']-o['close'])<1e-9,'first_time':times[0],'last_time':times[-1]}
              audit.append(row)
            except Exception as e:audit.append({'code':code,'error':repr(e)})
          pathlib.Path('validated-backfill-20261030-audit.json').write_text(json.dumps(audit,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(audit,ensure_ascii=False,indent=2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validated-backfill-20261030-audit.json
          git commit -m 'Audit all 10/30 intraday fallback paths' || true
          git push origin HEAD:prod-verify-no-yahoo-20261030
