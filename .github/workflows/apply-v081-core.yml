name: Apply v0.8.1 core page patch

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_v081_core.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch index core
        run: python scripts/patch_v081_core.py
      - name: Validate core markers
        run: |
          grep -q "const APP_VERSION='0.8.1'" index.html
          grep -q "live-v081.js?v=081" index.html
          ! grep -q "setInterval(()=>Promise.resolve(render(true)).catch(()=>{}),15000)" index.html
      - name: Commit patched index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Promote v0.8.1 live quotes into core page"
          git push
