name: Apply v0.9.2 PWA stability
on:
  push:
    paths:
      - 'scripts/patch_v092_pwa.py'
      - '.github/workflows/apply-v092-pwa.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/patch_v092_pwa.py
      - name: Validate runtime and service worker
        run: |
          node --check live-v091.js
          node --check sw.js
          grep -F "APP_VERSION='0.9.2'" index.html
          grep -F "const VERSION='0.9.2'" live-v091.js
          grep -F "tw-ai-monitor-v092" sw.js
          ! grep -F 'c.navigate(c.url)' sw.js
          ! grep -E '100dvh|-webkit-fill-available' index.html
      - name: Commit v0.9.2
        run: |
          if git diff --quiet -- index.html sw.js live-v091.js; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js live-v091.js
          git commit -m 'Promote v0.9.2 stable PWA live runtime'
          git push
