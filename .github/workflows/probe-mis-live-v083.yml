name: Probe MIS live sources v083
on:
  push:
    paths:
      - '.github/workflows/probe-mis-live-v083.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe current quote and chart endpoints
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo
          today=datetime.now(ZoneInfo('Asia/Taipei')).strftime('%Y%m%d')
          def text(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache','Pragma':'no-cache'})
              with urllib.request.urlopen(req,timeout=20) as r:return r.read().decode('utf-8')
          def get(url): return json.loads(text(url))
          tests=[('tse','0050'),('tse','3711'),('tse','2002'),('otc','3293')]
          for ex,code in tests:
              ch=f'{ex}_{code}.tw'
              qurl='https://mis.twse.com.tw/stock/api/getStockInfo.jsp?'+urllib.parse.urlencode({'ex_ch':ch,'json':'1','delay':'0','_':int(datetime.now().timestamp()*1000)})
              q=get(qurl); rows=[x for x in q.get('msgArray',[]) if str(x.get('c',''))==code]
              if not rows: raise SystemExit(f'{code}: quote missing')
              m=rows[0]; trade=m.get('trade') or {}; z=trade.get('z') or m.get('z')
              print('QUOTE',code,'date',m.get('d'),'outer_z',m.get('z'),'trade_z',trade.get('z'),'trade_t',trade.get('t'),'y',m.get('y'),'key',m.get('key'))
              if str(m.get('d',''))!=today: raise SystemExit(f'{code}: stale quote date')
              if z in (None,'','-','--','---'): raise SystemExit(f'{code}: no live trade')
              probes=[
                ('ohlc-key','https://mis.twse.com.tw/stock/api/getOhlc.jsp?'+urllib.parse.urlencode({'ex_ch':m.get('key') or f'{ch}_{today}','d0':today,'_':int(datetime.now().timestamp()*1000)})),
                ('ohlc-ch','https://mis.twse.com.tw/stock/api/getOhlc.jsp?'+urllib.parse.urlencode({'ex_ch':ch,'d0':today,'_':int(datetime.now().timestamp()*1000)})),
                ('statis','https://mis.twse.com.tw/stock/api/getChartOhlcStatis.jsp?'+urllib.parse.urlencode({'ex':ex,'ch':f'{code}.tw','fqy':'1','_':int(datetime.now().timestamp()*1000)})),
              ]
              for name,url in probes:
                  try:
                      raw=text(url); print('CHART',code,name,'bytes',len(raw),'head',raw[:220].replace('\n',' '))
                  except Exception as e: print('CHART',code,name,'ERROR',repr(e))
          print('QUOTE_PROBE_PASS',today)
          PY
