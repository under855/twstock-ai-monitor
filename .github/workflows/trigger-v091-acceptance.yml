name: Trigger v0.9.1 acceptance
on:
  push:
    paths:
      - '.github/workflows/trigger-v091-acceptance.yml'
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch complete v0.9.1 acceptance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/verify-v091-live.yml/dispatches \
            -d '{"ref":"main"}'
          echo ACCEPTANCE_DISPATCHED
