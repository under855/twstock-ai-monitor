name: Probe JPX COVER public data path
on:
  push:
    branches: ['source-migration-no-yahoo-20261030']
    paths: ['.github/workflows/probe-jpx-cover.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect JPX stock search JS
        shell: bash
        run: |
          set -e
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130 Safari/537.36'
          u='https://quote.jpx.co.jp/jpxhp/common/js/qc/pages/stock_search.js?20261015'
          curl -L -A "$ua" -sS "$u" -o /tmp/stock_search.js
          echo '=== size ==='; wc -c /tmp/stock_search.js
          echo '=== url/path strings ==='
          grep -oE 'https?://[^"'"' ]+|[A-Za-z0-9_./-]+\.(json|aspx|php)(\?[^"'"' ]*)?' /tmp/stock_search.js | sort -u | head -100 || true
          echo '=== ajax/get/post lines ==='
          grep -nEi '\$\.ajax|\$\.get|\$\.post|fetch\(|url[[:space:]]*:|stock[_-]?search|code_search' /tmp/stock_search.js | head -120 || true
          echo '=== first 24000 chars ==='
          head -c 24000 /tmp/stock_search.js
