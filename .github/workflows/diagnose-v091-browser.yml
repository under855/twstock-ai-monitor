name: Diagnose v0.9.1 browser live state
on:
  push:
    paths:
      - '.github/workflows/diagnose-v091-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright-core@latest
      - name: Inspect public mobile runtime
        env:
          URL: https://under855.github.io/twstock-ai-monitor/
        run: |
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser); export CHROME
          cat > diag091.mjs <<'JS'
          import { chromium } from 'playwright-core';
          const b=await chromium.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox']});
          const ctx=await b.newContext({viewport:{width:390,height:844},deviceScaleFactor:3,isMobile:true,hasTouch:true,timezoneId:'Asia/Taipei',locale:'zh-TW',serviceWorkers:'allow'});
          const p=await ctx.newPage();
          p.on('pageerror',e=>console.log('PAGEERROR',e.message));
          p.on('console',m=>{if(m.type()==='error'||m.type()==='warning')console.log('CONSOLE',m.type(),m.text())});
          p.on('requestfailed',r=>{if(/cors\.dev|allorigins|mis\.twse|query1\.finance/.test(r.url()))console.log('REQFAIL',r.url().slice(0,250),r.failure()?.errorText)});
          p.on('response',async r=>{if(/cors\.dev\/https:\/\/mis\.twse/.test(r.url())){console.log('MIS_PROXY_RESPONSE',r.status(),r.url().slice(0,220));try{const j=await r.json();console.log('MIS_PROXY_ROWS',JSON.stringify((j.msgArray||[]).map(m=>({c:m.c,ex:m.ex,d:m.d,z:m.z,t:m.t,trade:m.trade,y:m.y}))));}catch(e){console.log('MIS_PROXY_PARSE_ERR',String(e))}}});
          await p.goto(process.env.URL+'?diag091='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
          for(const ms of [3000,9000,18000]){
            await p.waitForTimeout(ms===3000?3000:ms===9000?6000:9000);
            const x=await p.evaluate(()=>({
              title:document.title,
              live:window.__TW_LIVE_V091__||null,
              watch:typeof watchlist==='function'?watchlist():null,
              universeReady:typeof universeReady!=='undefined'?universeReady:null,
              activeScripts:[...document.scripts].map(s=>s.src).filter(Boolean),
              rows:[...document.querySelectorAll('#watch article.row')].map(r=>({code:r.querySelector('.sym')?.textContent?.trim(),price:r.querySelector('.price')?.textContent,state:r.dataset.liveState,date:r.dataset.liveDate,meta:r.querySelector('.meta')?.textContent}))
            }));
            console.log('STATE_'+ms,JSON.stringify(x));
          }
          await b.close();
          JS
          timeout 100s node diag091.mjs
