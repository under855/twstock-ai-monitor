name: Production verification v0.9.4r2
on:
  push:
    branches: ['prod-verify-v094r2']
    paths:
      - '.github/workflows/prod-verify-v094r2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify deployed assets are current
        run: |
          SITE='https://under855.github.io/twstock-ai-monitor'
          curl -fsSL --max-time 20 "$SITE/?verify=$RANDOM" -o /tmp/index.html
          curl -fsSL --max-time 20 "$SITE/extras-v090.js?verify=$RANDOM" -o /tmp/extras.js
          curl -fsSL --max-time 20 "$SITE/live-v091.js?verify=$RANDOM" -o /tmp/live.js
          grep -F './extras-v090.js?v=094r2' /tmp/index.html
          test "$(sha256sum extras-v090.js | cut -d' ' -f1)" = "$(sha256sum /tmp/extras.js | cut -d' ' -f1)"
          test "$(sha256sum live-v091.js | cut -d' ' -f1)" = "$(sha256sum /tmp/live.js | cut -d' ' -f1)"
          echo ASSET_MATCH_PASS
      - name: Install browser harness
        run: |
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          test -n "$CHROME"
          echo "CHROME=$CHROME" >> "$GITHUB_ENV"
          npm install --no-save playwright-core@latest >/dev/null 2>&1
      - name: Verify production UI
        run: |
          cat > verify-prod.mjs <<'JS'
          import { chromium } from 'playwright-core';
          const browser=await chromium.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox']});
          const context=await browser.newContext({viewport:{width:390,height:844},locale:'zh-TW',timezoneId:'Asia/Taipei',serviceWorkers:'block'});
          const page=await context.newPage();
          const pageErrors=[]; page.on('pageerror',e=>pageErrors.push(e.message));
          await page.goto('https://under855.github.io/twstock-ai-monitor/?verify='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForFunction(()=>window.__TW_LIVE_V091__?.version==='0.9.4',null,{timeout:60000});
          await page.waitForFunction(()=>{
            const rows=[...document.querySelectorAll('#watch article.row')];
            return rows.length>=6 && rows.every(r=>{
              const score=r.querySelector('.scoreNum')?.textContent?.trim();
              return score && score!=='—';
            });
          },null,{timeout:60000});
          const main=await page.evaluate(()=>({
            rows:[...document.querySelectorAll('#watch article.row')].map(r=>({code:r.querySelector('.sym')?.textContent?.trim()||'',score:r.querySelector('.scoreNum')?.textContent?.trim()||'',label:r.querySelector('.scoreLabel')?.textContent?.trim()||'',canvas:!!r.querySelector('canvas.spark'),fallback:!!r.querySelector('.sparkFallback'),price:r.querySelector('.price')?.textContent?.trim()||''})),
            live:window.__TW_LIVE_V091__||null
          }));
          console.log('MAIN',JSON.stringify(main));
          if(main.rows.length<6) throw Error('missing monitored rows');
          if(main.rows.some(r=>r.score==='—'||r.label==='資料不足')) throw Error('score still insufficient '+JSON.stringify(main.rows));
          if(main.rows.some(r=>!r.canvas||r.fallback)) throw Error('main historical charts not restored '+JSON.stringify(main.rows));
          if(main.rows.some(r=>!r.price||r.price==='—')) throw Error('price missing');
          const row=page.locator('#watch article.row').filter({hasText:'0050'}).first();
          await row.click();
          await page.waitForSelector('#sheet.show',{timeout:15000});
          await page.waitForFunction(()=>document.querySelectorAll('#detailChartTabs button').length>=4,null,{timeout:15000});
          await page.waitForFunction(()=>document.querySelectorAll('#news .event').length>=1,null,{timeout:30000}).catch(()=>{});
          const detail=await page.evaluate(()=>({
            tabs:[...document.querySelectorAll('#detailChartTabs button')].map(b=>b.textContent.trim()),
            newsCount:document.querySelectorAll('#news .event').length,
            newsState:document.getElementById('newsState')?.textContent?.trim()||'',
            price:document.getElementById('dPrice')?.textContent?.trim()||'',
            scoreText:document.getElementById('scoreParts')?.textContent?.trim()||''
          }));
          console.log('DETAIL',JSON.stringify(detail));
          if(!detail.price||detail.price==='—') throw Error('detail price missing');
          if(!['今日','5日','20日','60日'].every(x=>detail.tabs.includes(x))) throw Error('detail chart tabs missing');
          if(detail.newsCount<1) throw Error('no rendered 0050 news; state='+detail.newsState);
          if(pageErrors.length) throw Error('page errors: '+pageErrors.join(' | '));
          console.log('PROD_VERIFY_PASS');
          await browser.close();
          JS
          node verify-prod.mjs
