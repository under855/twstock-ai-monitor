name: Temporary chart direction audit
on:
  push:
    branches: ['main']
    paths: ['.github/workflows/tmp-audit-chart-direction.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Compare retained chart endpoints with official daily OHLC
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.parse
          codes=['2330','009817','0050','3711','3293','2002','00878','00919']
          markets={'3293':'TPEx'}
          ua={'User-Agent':'Mozilla/5.0'}
          def get(u):
            req=urllib.request.Request(u,headers=ua)
            with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          intr=get('https://raw.githubusercontent.com/under855/twstock-ai-monitor/market-data/data/intraday/latest.json')
          print('SESSION',intr.get('date'))
          for c in codes:
            a=intr.get('stocks',{}).get(c,[])
            first=a[0] if a else {}; last=a[-1] if a else {}
            official={}
            try:
              if markets.get(c)=='TPEx':
                u='https://www.tpex.org.tw/www/zh-tw/afterTrading/tradingStock?code='+c+'&date='+urllib.parse.quote('2026/10/01')+'&response=json'
                j=get(u)
                for r in j.get('tables',[{}])[0].get('data',[]):
                  if str(r[0]).endswith('/10/30'):
                    official={'open':r[3],'high':r[4],'low':r[5],'close':r[6],'change':r[7]};break
              else:
                u='https://www.twse.com.tw/exchangeReport/STOCK_DAY?response=json&date=20261001&stockNo='+c
                j=get(u)
                for r in j.get('data',[]):
                  if str(r[0]).endswith('/10/30'):
                    official={'open':r[3],'high':r[4],'low':r[5],'close':r[6],'change':r[7]};break
            except Exception as e: official={'error':str(e)}
            def f(v):
              try:return float(str(v).replace(',','').replace('+',''))
              except:return None
            fo=f(first.get('close')); fl=f(last.get('close')); oo=f(official.get('open')); cc=f(official.get('close')); ch=f(official.get('change'))
            print(c,'FIRST',first.get('time'),fo,'LAST',last.get('time'),fl,'OFFICIAL',official,'OPEN->CLOSE',None if oo is None or cc is None else round(cc-oo,4),'VS_PREV',ch,'ENDPOINT_MATCH',fo==oo and fl==cc)
          PY
