name: Verify v0.8.1 core release

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'live-v081.js'
      - 'sw.js'
      - '.github/workflows/verify-v081-core.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check live core
        run: node --check live-v081.js
      - name: Verify index markers
        run: |
          grep -q "const APP_VERSION='0.8.1'" index.html
          grep -q "live-v081.js?v=081" index.html
          grep -q "v0.8.1｜手機優先" index.html
          ! grep -q "setInterval(()=>Promise.resolve(render(true)).catch(()=>{}),15000)" index.html
      - name: Verify clean service worker
        run: |
          grep -q "tw-ai-monitor-v081" sw.js
          grep -q "live-v081.js" sw.js
          ! grep -q "hotfix-v079.js" sw.js
      - name: Verify MIS live stock payload
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.parse
          codes=['0050','3711','2002','2330','3293']
          ch=[]
          for c in codes: ch += [f'tse_{c}.tw',f'otc_{c}.tw']
          upstream='https://mis.twse.com.tw/stock/api/getStockInfo.jsp?ex_ch='+urllib.parse.quote('|'.join(ch),safe='')+'&json=1&delay=0'
          url='https://proxy.cors.dev/'+upstream
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json','Origin':'https://under855.github.io'})
          with urllib.request.urlopen(req,timeout=20) as r:
              j=json.loads(r.read().decode('utf-8-sig'))
          good={}
          for x in j.get('msgArray') or []:
              c=str(x.get('c') or '')
              tz=(x.get('trade') or {}).get('z')
              if c and tz not in (None,'','-','--'): good[c]=tz
          miss=[c for c in codes if c not in good]
          if miss: raise SystemExit('missing latest trades: '+','.join(miss))
          print('V081_LIVE_PASS',good)
          PY
