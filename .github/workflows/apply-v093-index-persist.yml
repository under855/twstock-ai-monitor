name: Apply v0.9.3 TAIEX persistence
on:
  push:
    paths:
      - 'scripts/patch_v093_index_persist.py'
      - '.github/workflows/apply-v093-index-persist.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/patch_v093_index_persist.py
      - name: Validate v0.9.3
        run: |
          node --check live-v091.js
          node --check sw.js
          grep -F "APP_VERSION='0.9.3'" index.html
          grep -F "const VERSION='0.9.3'" live-v091.js
          grep -F "const IKEY='tw_live091_index_'" live-v091.js
          grep -F 'live-v091.js?v=093' index.html
          grep -F 'tw-ai-monitor-v093' sw.js
          ! grep -F 'c.navigate(c.url)' sw.js
      - name: Commit v0.9.3
        run: |
          if git diff --quiet -- index.html sw.js live-v091.js; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js live-v091.js
          git commit -m 'Promote v0.9.3 persistent live TAIEX state'
          git push
